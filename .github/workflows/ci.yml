name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    name: Build ADaM + TLFs, independent QC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::admiral
            any::pharmaversesdtm
            any::pharmaverseadam
            any::diffdf
            any::dplyr
            any::lubridate
            any::stringr
            any::tern
            any::rtables
            any::survival
            any::ggplot2
            any::testthat
          dependencies: '"hard"'

      - name: Build datasets
        run: Rscript run_all.R

      - name: Run tests (structure + QC against reference)
        run: Rscript tests/testthat.R

      - name: Upload QC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-reports-and-tlfs
          path: |
            outputs/qc/
            outputs/tlf/

  lint:
    name: lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr

      - name: Run lintr
        shell: Rscript {0}
        run: |
          lints <- lintr::lint_dir(".")
          if (length(lints) > 0) {
            print(lints)
            quit(status = 1)
          }
